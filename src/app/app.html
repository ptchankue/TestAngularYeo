@if (ui.isModern()) {
  <div class="m-app">
    <header class="m-header">
      <div class="m-wrap m-header__inner">
        <a class="m-brand" routerLink="/">
          <span class="m-brand__logo" aria-hidden="true">A</span>
          testWebApp
          <span class="m-pill">v21</span>
        </a>

        <nav class="m-nav" aria-label="Main">
          <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
          <a routerLink="/about" routerLinkActive="is-active">About</a>
        </nav>

        <div class="m-switch" role="group" aria-label="Interface version">
          <button type="button" [attr.aria-pressed]="false" (click)="ui.set('classic')">Classic</button>
          <button type="button" class="is-on" [attr.aria-pressed]="true">Modern</button>
        </div>
      </div>
    </header>

    <main class="m-wrap m-main">
      <router-outlet />
    </main>

    <footer class="m-footer">
      <div class="m-wrap">
        Built with Angular 21: standalone, zoneless, signals. Originally a 2016 Yeoman scaffold.
      </div>
    </footer>
  </div>
} @else {
  <header class="header">
    <nav class="navbar navbar-expand-md navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" routerLink="/" (click)="closeMenu()">testWebApp</a>

        <button
          type="button"
          class="navbar-toggler"
          aria-controls="main-nav"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Toggle navigation"
          (click)="toggleMenu()"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="main-nav" class="collapse navbar-collapse" [class.show]="menuOpen()">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" routerLink="/" routerLinkActive="active"
                 [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/" (click)="closeMenu()">Contact</a>
            </li>
          </ul>
          <button type="button" class="btn btn-sm btn-outline-primary" (click)="ui.set('modern')">
            Try the Angular 21 UI
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <router-outlet />
  </main>

  <footer class="footer">
    <div class="container">
      <p><span aria-hidden="true">♥</span> from the Yeoman team</p>
    </div>
  </footer>
}
