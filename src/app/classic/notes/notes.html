<form (ngSubmit)="createNote()" class="card card-body">
  <div class="row mb-3">
    <label for="note-content" class="col-sm-3 col-form-label">Note Content</label>
    <div class="col-sm-9">
      <textarea
        id="note-content"
        class="form-control"
        rows="4"
        placeholder="Note Content"
        [formControl]="content"
        [class.is-invalid]="content.invalid && content.touched"
      ></textarea>
      <div class="invalid-feedback">Please enter some content.</div>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-9 offset-sm-3 d-flex gap-2">
      <button type="button" class="btn btn-warning" (click)="clear()">Clear</button>
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </div>
</form>

@if (notes().length) {
  <ul class="list-group mt-3">
    @for (note of notes(); track $index) {
      <li class="list-group-item">{{ note }}</li>
    }
  </ul>
}
